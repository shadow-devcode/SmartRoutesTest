<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Smart Routes - Sistema de Rutas Inteligentes</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sistema de gestión y visualización de rutas para mercadistas">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Preconnect para Mapbox -->
  <link rel="preconnect" href="https://api.mapbox.com">
</head>
<body>
  <app-root>
    <!-- Loading inicial -->
    <div style="display: flex; justify-content: center; align-items: center; min-height: 100dvh; height: 100dvh; flex-direction: column; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
      <div style="width: 60px; height: 60px; border: 4px solid #ffffff; border-top: 4px solid transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <p style="color: white; margin-top: 20px; font-family: sans-serif; font-size: 18px; font-weight: 600;">Cargando Smart Routes...</p>
    </div>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </app-root>
</body>
</html>
