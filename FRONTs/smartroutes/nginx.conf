# Nginx para el SPA Angular + reverse-proxy de /api hacia el backend Flask.
# Front y API quedan en el MISMO origen → la cookie HttpOnly del refresh
# token funciona con SameSite=Lax sin configuración CORS adicional.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Debe ser >= MAX_UPLOAD_MB del backend (25 MB) + margen del multipart
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API → backend (nombre del servicio en docker-compose)
    location /api/ {
        proxy_pass http://back:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Alineado con --timeout 120 de gunicorn (descargas/ediciones largas)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Assets con hash en el nombre: cache inmutable de larga duración
    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea (es el puntero a los bundles versionados)
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA: cualquier ruta de Angular cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
